version: '3.8'

services:
  web:
    dns: 8.8.8.8
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: aihubton-web
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next 
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - server
    restart: unless-stopped

  server:
    dns: 8.8.8.8
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: aihubton-server
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    environment:
      - PORT=8000
      - DEBUG=true
      - SQLALCHEMY_DATABASE_URI=postgresql+asyncpg://aquarium:secret@db:5432/aquarium
      - TELEGRAM_BOT_POLLING_DISABLED=true
    depends_on:
      db:
        condition: service_healthy
    command: bash -c "python bootstrap.py && python main.py"
    restart: unless-stopped

  bot:
    dns: 8.8.8.8
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: aihubton-bot
    volumes:
      - ./server:/app
    environment:
      - PORT=8000
      - DEBUG=true
      - SQLALCHEMY_DATABASE_URI=postgresql+asyncpg://aquarium:secret@db:5432/aquarium
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_started
    command: watchmedo auto-restart --recursive --pattern="*.py" --directory="." python scripts/run_bot.py
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: aihubton-db
    environment:
      - POSTGRES_USER=aquarium
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=aquarium
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquarium -d aquarium"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
